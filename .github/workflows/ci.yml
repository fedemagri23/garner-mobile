name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, API contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --ci
      # The generated client must match the backend's contract on master.
      # A backend change that breaks it fails here, not in a user's hand.
      - run: npm run api:check
      # The app must bundle, which catches unresolved routes and modules.
      - run: npx expo export --platform android --output-dir /tmp/export
      # The web pages must carry the app: a document that drops its scripts is
      # served blank (MBUG-021), with nothing else to say so.
      - run: npx expo export --platform web --output-dir /tmp/export-web
      - run: grep -q '<script' /tmp/export-web/index.html
